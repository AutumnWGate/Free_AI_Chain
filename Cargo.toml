[package]
name = "faic_core"
version = "0.1.0"
edition = "2021"

[dependencies]
#types_amount
num-bigint = { version = "0.4.6", features = ["serde"] }
lazy_static = "1.5.0"

#network_config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_bytes = "0.11.15"
tokio = { version = "1", features = ["full"] }
toml = "0.8.19"
libp2p = { version = "0.55.0", features = ["secp256k1","tls","request-response","tcp", "yamux", "noise", "mdns", "tokio"] }

async-trait = "0.1.85"

secp256k1 = { version = "0.30.0", features = ["rand", "recovery", "global-context"] }
rand = "0.9.0"  # 用于生成随机数，例如在测试中生成随机地址
chrono = { version = "0.4.39", features = ["serde"] } # 时间处理
sha2 = "0.10.8" # SHA256 哈希算法
hex = { version = "0.4.3", features = ["serde"] } # 十六进制编码/解码
merkletree = "0.23.0" # Merkle 树

thiserror = "2.0.11"
typenum = "1.17.0"
log = "0.4.20"
env_logger = "0.11.6"
bip39 = "2.1.0"
bip32 = "0.5.2"
argon2 = "0.5.3"
ripemd = "0.1.3"
bech32 = "0.11.0"
bitcoin_hashes = "0.16.0"
aes-gcm = "0.10.3"

#异步数据库
sqlx = { version = "0.8.3", features = [
    "runtime-tokio-rustls",  # 运行时特性
    "sqlite",                # SQLite 特性
    "macros",               # 用于支持 query! 宏
    "migrate",              # 数据库迁移支持
    "chrono",               # 时间类型支持
] }

#test

